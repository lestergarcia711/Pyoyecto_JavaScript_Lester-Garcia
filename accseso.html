<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/acceso.css">

</head>
<body>
    <header class="header">
        <h1>CampusParking</h1>
        <p>¡Bienvenido al sistema de parqueadero!</p>

    </header>
    <!-- seccion para el login-->
    <main id="pantalla-login" class="contenedor-login">
        <div class="tarjeta-login">
            <h3 class="subtitulo">LOGIN</h3>
            
            <form id="formulario-login">

                <label for="login-usuario">Nombre de usuario</label>
                <input type="text" id="login-usuario" placeholder="Ingresa nombre del usuario" required>
    
                <label for="login-email">Correo electrónico</label>
                <input type="email" id="login-email" placeholder="Email" required>

    
                
                <label for="login-clave">Contraseña</label>
                <input type="password" id="login-clave" placeholder="" required>

                <div class="mostrar-password">
                 <input type="checkbox" id="mostrar">
                 <label for="mostrar">Mostrar contraseña</label>
                </div>

                <button type="submit" id="btn-entrar">Iniciar Sesión</button>
                <div id="alerta-login"></div>
            </form>
        </div>
    </main>
    <script src="js/acceso.js"></script>
</body>
</html>
