<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/acceso.css">

</head>
<body>
    <header class="header">
        <h1>CampusParking</h1>

    </header>
    <!-- seccion para el login-->
    <main id="pantalla-login" class="contenedor-login">
        <div class="tarjeta-login">
            <h3 class="subtitulo">LOGIN</h3>
            
            <form id="formulario-login">

                <label for="login-usuario">Nombre de usuario</label>
                <input type="text" id="login-usuario" placeholder="Ingresa nombre del usuario">
    
                <label for="login-email">Correo electrónico</label>
                <input type="email" id="login-email" placeholder="Email">
    
                
                <label for="login-clave">Contraseña</label>
                <input type="password" id="login-clave" placeholder="########">
    
                <button type="button" id="btn-entrar">Iniciar Sesión</button>
            </form>
        </div>
    </main>
    
</body>
</html>
